<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | Praveen Bat</title>
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</head>
<body>
  <main class="auth-shell">
    <section class="auth-card">
      <a class="brand" href="index.html"><b>P</b> PRAVEEN<span>BAT</span></a>
      <h1>Welcome back</h1>
      <p class="muted">Sign in to manage your fantasy sports account.</p>

      <form id="loginForm">
        <label>Email<input id="loginEmail" type="email" placeholder="you@example.com" required></label>
        <label>Password<input id="loginPassword" type="password" placeholder="Your password" required></label>
        <button class="btn primary" type="submit">Login</button>
      </form>

      <p class="muted center">New here? <a href="signup.html">Create an account</a></p>
      <small class="notice">Demo interface only. Do not use this prototype to process real-money wagering or payments.</small>
    </section>
  </main>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      await loginUser(
        document.getElementById("loginEmail").value,
        document.getElementById("loginPassword").value
      );
    });
  </script>
</body>
</html>
